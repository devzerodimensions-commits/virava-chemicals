# Render Blueprint — provisions a PostgreSQL database + a Node web service
# that builds the React client and serves it together with the API.
# In Render: New + → "Blueprint" → connect this repo → Apply.

databases:
  - name: virava-db
    databaseName: virava
    user: virava
    plan: free
    region: oregon

services:
  - type: web
    name: virava-chemicals
    runtime: node
    plan: free
    region: oregon
    buildCommand: "cd client && npm install --include=dev && npm run build && cd ../server && npm install --omit=dev"
    startCommand: "cd server && npm run start:prod"
    healthCheckPath: /api/health
    envVars:
      # Set in the Render dashboard, not derived from the blueprint database.
      # It was `fromDatabase: virava-db`, which pins the service to Render's own
      # Postgres — that instance expired on the free plan and took the site down
      # with it. sync:false lets the value point anywhere (Neon, Supabase, a paid
      # Render database) and stops the blueprint overwriting it on each deploy.
      - key: DATABASE_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES
        value: "7d"
      - key: ADMIN_NAME
        value: "Virava Admin"
      - key: ADMIN_EMAIL
        value: "admin@viravachemicals.com"
      - key: ADMIN_PASSWORD
        value: "Virava@2026"
      # Client build flag: "false" = full website live, "true" = home page only
      - key: VITE_HOME_ONLY
        value: "false"
